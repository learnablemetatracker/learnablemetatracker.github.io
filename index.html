<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LearnableMetaTracker</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🌍</span>
        <span class="brand-name" data-i18n="appTitle"></span>
      </div>
      <nav class="sidebar-nav">
        <a href="#/" data-i18n="myMaps"></a>
        <a href="#/metas" data-i18n="allMetas"></a>
        <a href="#/help" data-i18n="help"></a>
      </nav>
      <a
        class="learnablemeta-btn"
        href="https://www.learnablemeta.com/maps"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="learnablemeta-btn-icon" aria-hidden="true">🌐</span>
        <span data-i18n="learnableMetaLink"></span>
      </a>
      <nav class="sidebar-external">
        <a href="https://super-duper.fr/quiz2024/" target="_blank" rel="noopener noreferrer">
          <span data-i18n="quizLink"></span>
          <span class="external-icon" aria-hidden="true">↗</span>
        </a>
        <a href="https://map-making.app/manual/introduction.html" target="_blank" rel="noopener noreferrer">
          <span data-i18n="mapMakingManualLink"></span>
          <span class="external-icon" aria-hidden="true">↗</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <label class="import-control">
          <span id="import-data-label"></span>
          <input type="file" id="import-data-input" accept="application/json" hidden />
        </label>
        <button id="download-data-btn" class="btn-ghost"></button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <select id="language-select" aria-label="Language">
          <option value="en">EN</option>
          <option value="es">ES</option>
        </select>
      </header>
      <main id="app-root"></main>
    </div>
  </div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
