<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnable Meta (GeoGuessr) Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-top">
                <a href="index.html" class="btn-back">← Back</a>
                <h1>🌍 Learnable Meta Tracker</h1>
                <div style="width: 80px;"></div>
            </div>
            <p class="subtitle">Track your progress on all learning maps</p>
        </header>

        <!-- Stats Section -->
        <section class="stats-section">
            <div class="stat-card">
                <div class="stat-number" id="totalMaps">0</div>
                <div class="stat-label">Maps completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="easyCount">0</div>
                <div class="stat-label">Easy</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="mediumCount">0</div>
                <div class="stat-label">Medium</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="hardCount">0</div>
                <div class="stat-label">Hard</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="streakDays">0</div>
                <div class="stat-label">Streak (days)</div>
            </div>
        </section>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Available Maps Section -->
            <section class="available-maps-section">
                <h2>📍 Available maps</h2>
                <div class="available-filter">
                    <input
                        type="text"
                        id="availableSearch"
                        placeholder="🔍 Search map..."
                        class="search-input"
                    >
                </div>
                <div id="availableMapsList" class="available-maps-grid">
                    <div class="empty-state"><p>Loading maps...</p></div>
                </div>
            </section>

            <!-- Completed Maps Section -->
            <section class="maps-section">
                <h2>✅ Completed maps</h2>
                <div class="filter-section">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="easy">Easy</button>
                    <button class="filter-btn" data-filter="medium">Medium</button>
                    <button class="filter-btn" data-filter="hard">Hard</button>
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="🔍 Search map..."
                        class="search-input"
                    >
                </div>
                <div id="mapsList" class="maps-grid">
                    <div class="empty-state">
                        <p>No completed maps yet. Start in the section above!</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Statistics Chart Section -->
        <section class="chart-section">
            <h2>Statistics</h2>
            <div class="chart-container">
                <div class="chart-item">
                    <div class="mini-chart" id="difficultyChart">
                        <div class="chart-title">By difficulty</div>
                    </div>
                </div>
                <div class="chart-item">
                    <div class="mini-chart" id="scoreChart">
                        <div class="chart-title">Average score</div>
                        <div class="score-avg" id="scoreAvg">0</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer with Export/Import -->
        <footer class="footer">
            <button id="exportBtn" class="btn-secondary">📥 Export data</button>
            <button id="importBtn" class="btn-secondary">📤 Import data</button>
            <button id="clearBtn" class="btn-secondary danger">🗑️ Clear all</button>
            <input type="file" id="importFile" accept=".json" style="display: none;">
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
